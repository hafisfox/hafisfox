<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" role="img"><title>Hi, I'm Hafis. I turn inboxes, spreadsheets and handoffs into systems that run themselves. Co-Founder &amp; CTO at LokaX AI, based in Bangkok.</title>
  <style>
    .fade{opacity:0;animation:fade .9s ease forwards}
    .rise{opacity:0;transform:translateY(18px);animation:rise 1s cubic-bezier(.16,1,.3,1) forwards}
    @keyframes fade{to{opacity:1}}
    @keyframes rise{to{opacity:1;transform:none}}
    .blink{animation:blink 2.4s ease-in-out infinite}
    @keyframes blink{50%{opacity:.25}}
    @media (prefers-reduced-motion:reduce){*{animation:none!important}.fade{opacity:1}.rise{opacity:1;transform:none}}
  </style>
  <rect width="1200" height="400" rx="20" fill="#f3f2ee"/>
  <rect x=".5" y=".5" width="1199" height="399" rx="19.5" fill="none" stroke="#0000001a"/>
  <text x="56" y="76" class="fade" font-family="'Inter Tight','Inter','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="15" letter-spacing=".5" fill="#6f6f6f">HI, I'M HAFIS</text>
  <circle cx="1136" cy="70" r="6" fill="#1f8f63" class="blink"/>
  <g font-weight="300" letter-spacing="-1.6" font-family="'Inter Tight','Inter','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="52" fill="#0d0d0d">
    <text x="56" y="156" class="rise">I turn inboxes, spreadsheets and handoffs</text>
    <text x="56" y="220" class="rise" style="animation-delay:.12s">into <tspan font-family="'Instrument Serif','Iowan Old Style',Georgia,'Times New Roman',serif" font-style="italic" font-weight="400" letter-spacing="-.5" font-size="58" fill="#1f8f63">systems that run themselves.</tspan></text>
  </g>
  <line x1="56" y1="282" x2="1144" y2="282" stroke="#0000001a"/>
  <g class="fade" style="animation-delay:0.5s">
    <text x="56" y="322" font-family="'Inter Tight','Inter','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="14" letter-spacing=".5" fill="#6f6f6f">ROLE</text>
    <text x="56" y="356" font-family="'Inter Tight','Inter','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="21" fill="#0d0d0d">Co-Founder &amp; CTO, LokaX AI</text>
  </g>
  <g class="fade" style="animation-delay:0.62s">
    <text x="426" y="322" font-family="'Inter Tight','Inter','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="14" letter-spacing=".5" fill="#6f6f6f">BASE</text>
    <text x="426" y="356" font-family="'Inter Tight','Inter','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="21" fill="#0d0d0d">Bangkok, working worldwide</text>
  </g>
  <g class="fade" style="animation-delay:0.74s">
    <text x="796" y="322" font-family="'Inter Tight','Inter','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="14" letter-spacing=".5" fill="#6f6f6f">MODEL</text>
    <text x="796" y="356" font-family="'Inter Tight','Inter','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="21" fill="#0d0d0d">One builder, start to finish</text>
  </g>
</svg>
