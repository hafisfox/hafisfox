<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img"><title>Got a workflow eating your week? Let's make it run itself. See fixed prices at hafisfox.io/pricing.</title>
  <style>
    .fade{opacity:0;animation:fade .9s ease forwards}
    .rise{opacity:0;transform:translateY(18px);animation:rise 1s cubic-bezier(.16,1,.3,1) forwards}
    @keyframes fade{to{opacity:1}}
    @keyframes rise{to{opacity:1;transform:none}}
    .nudge{animation:nudge 2.2s cubic-bezier(.16,1,.3,1) infinite}
    @keyframes nudge{50%{transform:translate(3px,-3px)}}
    @media (prefers-reduced-motion:reduce){*{animation:none!important}.fade{opacity:1}.rise{opacity:1;transform:none}}
  </style>
  <rect width="1200" height="360" rx="20" fill="#b7f4db"/>
  <rect x=".5" y=".5" width="1199" height="359" rx="19.5" fill="none" stroke="#b7f4db"/>
  <text x="64" y="84" font-family="'Inter Tight','Inter','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="15" letter-spacing=".5" fill="#0b120e" opacity=".7">WORK WITH ME</text>
  <text x="64" y="172" class="rise" font-family="'Inter Tight','Inter','Helvetica Neue',Helvetica,Arial,sans-serif" font-weight="300" font-size="60" letter-spacing="-2.4" fill="#0b120e">Got a workflow eating your week?</text>
  <text x="64" y="244" class="rise" style="animation-delay:.12s" font-family="'Instrument Serif','Iowan Old Style',Georgia,'Times New Roman',serif" font-style="italic" font-size="66" fill="#0b120e">Let's make it run itself.</text>
  <g transform="translate(901 266)" class="fade" style="animation-delay:.4s">
    <rect width="235" height="56" rx="28" fill="#0b120e"/>
    <text x="30" y="35" font-family="'Inter Tight','Inter','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="20" font-weight="500" fill="#b7f4db">See fixed prices</text>
    <path d="M191 36l10-10m-8 0h8v8" fill="none" stroke="#b7f4db" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="nudge"/>
  </g>
</svg>
