<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img"><title>Hafis Javad. From workflows to systems: operations that run themselves.</title>
  <style>
    .fade{opacity:0;animation:fade .9s ease forwards}
    .rise{opacity:0;transform:translateY(18px);animation:rise 1s cubic-bezier(.16,1,.3,1) forwards}
    @keyframes fade{to{opacity:1}}
    @keyframes rise{to{opacity:1;transform:none}}
    .track{stroke-dasharray:1040;stroke-dashoffset:1040;animation:draw 1.6s cubic-bezier(.76,0,.24,1) 1.1s forwards}
    .pulse{offset-path:path('M80 552 H1120');opacity:0;animation:move 3.2s cubic-bezier(.76,0,.24,1) 2.6s infinite}
    @keyframes draw{to{stroke-dashoffset:0}}
    @keyframes move{0%{offset-distance:0%;opacity:0}10%,85%{opacity:1}100%{offset-distance:100%;opacity:0}}
    @media (prefers-reduced-motion:reduce){.track{stroke-dashoffset:0}.pulse{display:none}}
    @media (prefers-reduced-motion:reduce){*{animation:none!important}.fade{opacity:1}.rise{opacity:1;transform:none}}
  </style>
  <rect width="1200" height="620" rx="20" fill="#f3f2ee"/>
  <rect x=".5" y=".5" width="1199" height="619" rx="19.5" fill="none" stroke="#0000001a"/>
  <g class="fade" style="animation-delay:.9s" font-family="'Inter Tight','Inter','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="15" letter-spacing=".4" fill="#6f6f6f">
    <text x="48" y="58">HAFIS JAVAD</text>
    <text x="600" y="58" text-anchor="middle">APPLIED AI &amp; AUTOMATION</text>
    <text x="1152" y="58" text-anchor="end">BANGKOK · HAFISFOX.IO</text>
  </g>
  <line x1="48" y1="80" x2="1152" y2="80" stroke="#0000001a"/>
  <text x="190" y="185" class="rise" style="animation-delay:0s" font-family="'Inter Tight','Inter','Helvetica Neue',Helvetica,Arial,sans-serif" font-style="normal" font-weight="300" font-size="96" letter-spacing="-4.5" fill="#0d0d0d">From Workflows</text>
  <text x="520" y="282" class="rise" style="animation-delay:0.12s" font-family="'Instrument Serif','Iowan Old Style',Georgia,'Times New Roman',serif" font-style="italic" font-weight="400" font-size="104" letter-spacing="-1" fill="#0d0d0d">to Systems</text>
  <text x="220" y="379" class="rise" style="animation-delay:0.24s" font-family="'Inter Tight','Inter','Helvetica Neue',Helvetica,Arial,sans-serif" font-style="normal" font-weight="300" font-size="96" letter-spacing="-4.5" fill="#0d0d0d">operations that run</text>
  <text x="540" y="476" class="rise" style="animation-delay:0.36s" font-family="'Instrument Serif','Iowan Old Style',Georgia,'Times New Roman',serif" font-style="italic" font-weight="400" font-size="104" letter-spacing="-1" fill="#1f8f63">themselves</text>
  <line x1="80" y1="552" x2="1120" y2="552" stroke="#0000001a" stroke-width="1.5"/>
  <line class="track" x1="80" y1="552" x2="1120" y2="552" stroke="#1f8f63" stroke-width="1.5" stroke-opacity=".55"/>
  <circle class="pulse" r="4" fill="#1f8f63"/>
  <g class="fade" style="animation-delay:1.2s">
    <circle cx="80" cy="552" r="4" fill="#f3f2ee" stroke="#6f6f6f" stroke-width="1.5"/>
    <text x="80" y="582" text-anchor="middle" font-family="'Inter Tight','Inter','Helvetica Neue',Helvetica,Arial,sans-serif" font-style="normal" font-size="15" fill="#6f6f6f">inbox</text>
  </g>
  <g class="fade" style="animation-delay:1.3199999999999998s">
    <circle cx="340" cy="552" r="4" fill="#f3f2ee" stroke="#6f6f6f" stroke-width="1.5"/>
    <text x="340" y="582" text-anchor="middle" font-family="'Inter Tight','Inter','Helvetica Neue',Helvetica,Arial,sans-serif" font-style="normal" font-size="15" fill="#6f6f6f">sheets</text>
  </g>
  <g class="fade" style="animation-delay:1.44s">
    <circle cx="600" cy="552" r="4" fill="#f3f2ee" stroke="#6f6f6f" stroke-width="1.5"/>
    <text x="600" y="582" text-anchor="middle" font-family="'Inter Tight','Inter','Helvetica Neue',Helvetica,Arial,sans-serif" font-style="normal" font-size="15" fill="#6f6f6f">calls</text>
  </g>
  <g class="fade" style="animation-delay:1.56s">
    <circle cx="860" cy="552" r="4" fill="#f3f2ee" stroke="#6f6f6f" stroke-width="1.5"/>
    <text x="860" y="582" text-anchor="middle" font-family="'Inter Tight','Inter','Helvetica Neue',Helvetica,Arial,sans-serif" font-style="normal" font-size="15" fill="#6f6f6f">DMs</text>
  </g>
  <g class="fade" style="animation-delay:1.68s">
    <circle cx="1120" cy="552" r="7" fill="#1f8f63" stroke="#1f8f63" stroke-width="1.5"/>
    <text x="1120" y="582" text-anchor="middle" font-family="'Instrument Serif','Iowan Old Style',Georgia,'Times New Roman',serif" font-style="italic" font-size="20" fill="#1f8f63">system</text>
  </g>
</svg>
