<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="330" viewBox="0 0 1200 330" role="img"><title>How I work: Map the real handoffs. Build on the tools you already use. Ship in weeks at a fixed price. Run it with monitoring, fixes and a monthly report.</title>
  <style>
    .fade{opacity:0;animation:fade .9s ease forwards}
    .rise{opacity:0;transform:translateY(18px);animation:rise 1s cubic-bezier(.16,1,.3,1) forwards}
    @keyframes fade{to{opacity:1}}
    @keyframes rise{to{opacity:1;transform:none}}
    .flow{stroke-dasharray:60 900;animation:flow 3.6s cubic-bezier(.76,0,.24,1) infinite}
    @keyframes flow{from{stroke-dashoffset:60}to{stroke-dashoffset:-900}}
    @media (prefers-reduced-motion:reduce){*{animation:none!important}.fade{opacity:1}.rise{opacity:1;transform:none}}
  </style>
  <rect width="1200" height="330" rx="20" fill="#0a0a0a"/>
  <rect x=".5" y=".5" width="1199" height="329" rx="19.5" fill="none" stroke="#ffffff1f"/>
  <text x="56" y="76" font-family="'Inter Tight','Inter','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="15" letter-spacing=".5" fill="#8a8a8a">HOW I WORK</text>
  <line x1="64" y1="132" x2="904" y2="132" stroke="#ffffff38" stroke-width="1.5"/>
  <line class="flow" x1="64" y1="132" x2="904" y2="132" stroke="#b7f4db" stroke-width="1.5"/>
  <g class="rise" style="animation-delay:0s">
    <circle cx="64" cy="132" r="8" fill="#0a0a0a" stroke="#b7f4db" stroke-width="1.5"/>
    <text x="56" y="204" font-family="'Instrument Serif','Iowan Old Style',Georgia,'Times New Roman',serif" font-style="italic" font-size="60" fill="#f6f6f6">Map</text>
    <text x="56" y="250" font-family="'Inter Tight','Inter','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="19" fill="#8a8a8a">the real handoffs</text>
    <text x="56" y="276" font-family="'Inter Tight','Inter','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="19" fill="#8a8a8a">before any code</text>
  </g>
  <g class="rise" style="animation-delay:0.14s">
    <circle cx="344" cy="132" r="8" fill="#0a0a0a" stroke="#b7f4db" stroke-width="1.5"/>
    <text x="336" y="204" font-family="'Instrument Serif','Iowan Old Style',Georgia,'Times New Roman',serif" font-style="italic" font-size="60" fill="#f6f6f6">Build</text>
    <text x="336" y="250" font-family="'Inter Tight','Inter','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="19" fill="#8a8a8a">on the tools</text>
    <text x="336" y="276" font-family="'Inter Tight','Inter','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="19" fill="#8a8a8a">you already use</text>
  </g>
  <g class="rise" style="animation-delay:0.28s">
    <circle cx="624" cy="132" r="8" fill="#0a0a0a" stroke="#b7f4db" stroke-width="1.5"/>
    <text x="616" y="204" font-family="'Instrument Serif','Iowan Old Style',Georgia,'Times New Roman',serif" font-style="italic" font-size="60" fill="#f6f6f6">Ship</text>
    <text x="616" y="250" font-family="'Inter Tight','Inter','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="19" fill="#8a8a8a">in weeks,</text>
    <text x="616" y="276" font-family="'Inter Tight','Inter','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="19" fill="#8a8a8a">at a fixed price</text>
  </g>
  <g class="rise" style="animation-delay:0.42000000000000004s">
    <circle cx="904" cy="132" r="8" fill="#b7f4db" stroke="#b7f4db" stroke-width="1.5"/>
    <text x="896" y="204" font-family="'Instrument Serif','Iowan Old Style',Georgia,'Times New Roman',serif" font-style="italic" font-size="60" fill="#f6f6f6">Run</text>
    <text x="896" y="250" font-family="'Inter Tight','Inter','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="19" fill="#8a8a8a">monitoring, fixes</text>
    <text x="896" y="276" font-family="'Inter Tight','Inter','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="19" fill="#8a8a8a">and a monthly report</text>
  </g>
</svg>
