<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="t d">
  <title id="t">Hafis Javad — From Workflows to Systems</title>
  <desc id="d">Applied AI and automation engineer. Operations that run themselves.</desc>
  <style>
    .l{opacity:0;transform:translateY(28px);animation:rise 1.1s cubic-bezier(.16,1,.3,1) forwards}
    .l1{animation-delay:.12s}.l2{animation-delay:.24s}.l3{animation-delay:.36s}
    .n{opacity:0;animation:fade .8s ease forwards}
    .meta{opacity:0;animation:fade 1s ease .9s forwards}
    .track{stroke-dasharray:1040;stroke-dashoffset:1040;animation:draw 1.6s cubic-bezier(.76,0,.24,1) 1.1s forwards}
    .pulse{offset-path:path('M80 552 H1120');animation:move 3.2s cubic-bezier(.76,0,.24,1) 2.6s infinite;opacity:0}
    @keyframes rise{to{opacity:1;transform:none}}
    @keyframes fade{to{opacity:1}}
    @keyframes draw{to{stroke-dashoffset:0}}
    @keyframes move{0%{offset-distance:0%;opacity:0}10%{opacity:1}85%{opacity:1}100%{offset-distance:100%;opacity:0}}
    @media (prefers-reduced-motion:reduce){.l,.n,.meta,.track{animation:none;opacity:1;transform:none;stroke-dashoffset:0}.pulse{display:none}}
  </style>
  <rect width="1200" height="620" rx="20" fill="#0a0a0a"/>
  <rect x=".5" y=".5" width="1199" height="619" rx="19.5" fill="none" stroke="#ffffff1f"/>
  <g class="meta" font-family="'Inter Tight','Inter','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="15" letter-spacing=".4" fill="#878787">
