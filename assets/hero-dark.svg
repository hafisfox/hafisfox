    <text x="600" y="58" text-anchor="middle">APPLIED AI &amp; AUTOMATION</text>
    <text x="1152" y="58" text-anchor="end">BANGKOK · HAFISFOX.IO</text>
  </g>
  <line x1="48" y1="80" x2="1152" y2="80" stroke="#ffffff1f"/>
  <text x="190" y="185" class="l l0" font-family="'Inter Tight','Inter','Helvetica Neue',Helvetica,Arial,sans-serif" font-style="normal" font-weight="300" font-size="96" letter-spacing="-4.5" fill="#f6f6f6">From Workflows</text>
  <text x="520" y="282" class="l l1" font-family="'Instrument Serif','Iowan Old Style',Georgia,'Times New Roman',serif" font-style="italic" font-weight="400" font-size="104" letter-spacing="-1" fill="#f6f6f6">to Systems</text>
  <text x="220" y="379" class="l l2" font-family="'Inter Tight','Inter','Helvetica Neue',Helvetica,Arial,sans-serif" font-style="normal" font-weight="300" font-size="96" letter-spacing="-4.5" fill="#f6f6f6">operations that run</text>
  <text x="540" y="476" class="l l3" font-family="'Instrument Serif','Iowan Old Style',Georgia,'Times New Roman',serif" font-style="italic" font-weight="400" font-size="104" letter-spacing="-1" fill="#b7f4db">themselves</text>
  <line x1="80" y1="552" x2="1120" y2="552" stroke="#ffffff1f" stroke-width="1.5"/>
  <line class="track" x1="80" y1="552" x2="1120" y2="552" stroke="#b7f4db" stroke-width="1.5" stroke-opacity=".55"/>
  <circle class="pulse" r="4" fill="#b7f4db"/>
  <g class="n" style="animation-delay:1.2s">
    <circle cx="80" cy="552" r="4" fill="#0a0a0a" stroke="#878787" stroke-width="1.5"/>
    <text x="80" y="582" text-anchor="middle" font-family="'Inter Tight','Inter','Helvetica Neue',Helvetica,Arial,sans-serif" font-style="normal" font-size="15" fill="#878787">inbox</text>
  </g>
  <g class="n" style="animation-delay:1.3199999999999998s">
    <circle cx="340" cy="552" r="4" fill="#0a0a0a" stroke="#878787" stroke-width="1.5"/>
    <text x="340" y="582" text-anchor="middle" font-family="'Inter Tight','Inter','Helvetica Neue',Helvetica,Arial,sans-serif" font-style="normal" font-size="15" fill="#878787">sheets</text>
  </g>
  <g class="n" style="animation-delay:1.44s">
    <circle cx="600" cy="552" r="4" fill="#0a0a0a" stroke="#878787" stroke-width="1.5"/>
    <text x="600" y="582" text-anchor="middle" font-family="'Inter Tight','Inter','Helvetica Neue',Helvetica,Arial,sans-serif" font-style="normal" font-size="15" fill="#878787">calls</text>
  </g>
  <g class="n" style="animation-delay:1.56s">
    <circle cx="860" cy="552" r="4" fill="#0a0a0a" stroke="#878787" stroke-width="1.5"/>
    <text x="860" y="582" text-anchor="middle" font-family="'Inter Tight','Inter','Helvetica Neue',Helvetica,Arial,sans-serif" font-style="normal" font-size="15" fill="#878787">DMs</text>
  </g>
  <g class="n" style="animation-delay:1.68s">
    <circle cx="1120" cy="552" r="7" fill="#b7f4db" stroke="#b7f4db" stroke-width="1.5"/>
    <text x="1120" y="582" text-anchor="middle" font-family="'Instrument Serif','Iowan Old Style',Georgia,'Times New Roman',serif" font-style="italic" font-size="20" fill="#b7f4db">system</text>
